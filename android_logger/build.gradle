plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def versionMajor = 1
def versionMinor = 5
def versionPatch = 0

def loggerVersionCode = versionMajor * 10000 + 1000 * versionMinor + versionPatch

def loggerVersion = "${versionMajor}.${versionMinor}.${versionPatch}"

android {
    namespace 'apps.in.android_logger'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode loggerVersionCode
        versionName loggerVersion
        buildConfigField "String", "VERSION", "\"${loggerVersion}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'apps.in'
                artifactId = 'logger'
                version = loggerVersion
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/apps-in/Logger')
                credentials {
                    username = System.getenv('GITHUB_PKG_USER')
                    password = System.getenv('GITHUB_PKG_TOKEN')
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
