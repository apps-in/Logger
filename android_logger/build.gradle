plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

def versionMajor = 1
def versionMinor = 5
def versionPatch = 0

def loggerVersionCode = versionMajor * 10000 + 1000 * versionMinor + versionPatch

def loggerVersion = "${versionMajor}.${versionMinor}.${versionPatch}"

android {
    namespace 'apps.in.android_logger'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode loggerVersionCode
        versionName loggerVersion
        buildConfigField "String", "VERSION", "\"${loggerVersion}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

signing {
    def inMemoryKey = findProperty('signingInMemoryKey') ?: findProperty('signing.inMemoryKey')
    if (inMemoryKey) {
        useInMemoryPgpKeys(
            (findProperty('signingInMemoryKeyId') ?: findProperty('signing.keyId')) as String,
            inMemoryKey as String,
            (findProperty('signingInMemoryKeyPassword') ?: findProperty('signing.password')) as String,
        )
    } else {
        useGpgCmd()
    }
}

mavenPublishing {
    publishToMavenCentral(true)

    signAllPublications()

    coordinates('io.github.ihor-nepomniashchyi', 'logger', loggerVersion)

    pom {
        name = 'Logger'
        description = 'Android logging library with console, file, and lifecycle logging.'
        inceptionYear = '2018'
        url = 'https://github.com/apps-in/Logger/'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'ihor-nepomniashchyi'
                name = 'Ihor Nepomniashchyi'
                url = 'https://github.com/ihor-nepomniashchyi/'
            }
        }
        scm {
            url = 'https://github.com/apps-in/Logger/'
            connection = 'scm:git:git://github.com/apps-in/Logger.git'
            developerConnection = 'scm:git:ssh://git@github.com/apps-in/Logger.git'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
